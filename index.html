<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Baluster Quantity Calculator">
    <meta name="keywords" content="baluster, railing, deck">
    <meta name="robots" content="all">
    <title>Baluster Quantity Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="PageWrapper">
        <header id="Header">
        </header>
        
        <main id="calculatorwrapper">
            <div id="CalcilatorContentColumn">
                <div class="Liner">
                    <div class="Logo">
                        <img src="/assets/Decksgo without shadow-01.png" alt="DecksGo.com">
                    </div>
                    <h1>Baluster Quantity Calculator</h1>
                    <div class="CalloutBox">
                        <noscript>
                            <p>Sorry, to use this calculator you need to enable JavaScript.</p>
                        </noscript>
                        <form id="calculatorForm">
                            <div class="stepsarea">
                                <div class="step1">
                                    <h2>Step 1</h2>
                                    <p><strong>Total Feet of Railing (including posts)</strong></p>
                                    <table>
                                        <tr>
                                            <td>Feet:</td>
                                            <td colspan="1"><input type="number" id="rlFeet" name="rlFeet" placeholder="0"></td>
                                        </tr>
                                        <tr>
                                            <td>Inches:</td>
                                            <td><input type="number" id="rlInches" name="rlInches" placeholder="0"></td>
                                            <td>
                                                <select id="rlFraction" name="rlFraction">
                                                    <option value="0">0</option>
                                                    <option value=".125">1/8</option>
                                                    <option value=".25">1/4</option>
                                                    <option value=".375">3/8</option>
                                                    <option value=".5">1/2</option>
                                                    <option value=".625">5/8</option>
                                                    <option value=".75">3/4</option>
                                                    <option value=".875">7/8</option>
                                                </select>
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                                <div class="step2">
                                    <h2>Step 2</h2>
                                    <p><strong>Number of Posts</strong></p>
                                    <table>
                                        <tr>
                                            <td><label for="fourbyfour">3-1/2" (4x4)</label></td>
                                            <td><input type="number" id="fourbyfour" placeholder="0"></td>
                                        </tr>
                                        <tr>
                                            <td><label for="fourinch">4"</label></td>
                                            <td><input type="number" id="fourinch" placeholder="0"></td>
                                        </tr>
                                        <tr>
                                            <td><label for="fourandhalf">4-1/2"</label></td>
                                            <td><input type="number" id="fourandhalf" placeholder="0"></td>
                                        </tr>
                                        <tr>
                                            <td><label for="fiveinch">5"</label></td>
                                            <td><input type="number" id="fiveinch" placeholder="0"></td>
                                        </tr>
                                        <tr>
                                            <td><label for="sixbysix">5-1/2" (6x6)</label></td>
                                            <td><input type="number" id="sixbysix" placeholder="0"></td>
                                        </tr>
                                    </table>
                                </div>
                                <div class="step3">
                                    <h2>Step 3</h2>
                                    <input name="balspec" type="hidden" class="bal" value="0.75"> <!-- Hidden input to store width -->
                                    <p><strong>Space Between Balusters (max 4")</strong></p>
                                    <table>
                                        <tr>
                                            <td><input name="balspace" type="number" class="bal" placeholder="0"></td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                            <div class="stepscontent">
                                <div class="button-container">
                                    <button type="button" id="railingCalc">Calculate</button>
                                </div>
                            </div>
                        </form>
                        <div class="results-cont" style="width: 100%; display: inline-table; clear: both;">
                            <div id="results">
                                <div id="calcs"></div>
                                <div id="errors"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
