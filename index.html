<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Baluster Quantity Calculator">
    <meta name="keywords" content="baluster, railing, deck">
    <meta name="robots" content="all">
    <title>Baluster Quantity Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="PageWrapper">
        <main id="calculatorwrapper">
            <div class="Liner">
                <div class="logo">
                    <img src="assets/Decksgo without shadow-01.png" height="50">
                </div>
                <h1 class="resulttext">Baluster Quantity Calculator</h1>
                <div class="CalloutBox">
                    <noscript>
                        <p>Sorry, to use this calculator you need to enable JavaScript.</p>
                    </noscript>
                    <form id="calculatorForm">
                        <div class="stepsarea">
                            <div class="step1">
                                <img src="/assets/sections.png">
                                <h2>Step 1: Specify Number of Sections</h2>
                                <label for="numSections"><strong>Number of Sections:</strong></label>
                                <input type="number" id="numSections" name="numSections" placeholder="0" min="1">
                            </div>
                            <div class="step2">
                                <h2>Step 2: Enter Length of Each Section</h2>
                                <div class="sectionInputsContainer"></div>
                            </div>
                            <div class="step3">
                                <img src="/assets/baluster spacing.png">
                                <h2>Step 3: Set Space Between Balusters</h2>
                                <label for="balusterSpace"><strong>Space Between Balusters (max 4"):</strong></label>
                                <input type="number" id="balusterSpace" name="balusterSpace" placeholder="0" min="0" max="4" step="0.01">
                            </div>
                            <div class="step4">
                                <h2>Results:</h2>
                                <div id="results">
                                <div id="calcs">
                                    Please Enter # of Sections
                                    <div id="errors"></div>
                                </div>
                            </div>
                        </div>
                        <div class="stepscontent">
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
